<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Theorem Zero - Savant Plate Reader</title>
<style>
:root{color-scheme:dark;--bg:#000408;--ink:#eaf9ff;--ghost:rgba(234,249,255,.42);--faint:rgba(234,249,255,.18)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 50% 47%,#09202a 0%,#020b12 58%,#000 100%)}
.stage{width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden}svg{width:min(100vw,calc(100vh*.5625));height:min(100vh,calc(100vw/.5625));display:block;background:#020b12}.nav-arrow{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;border:1px solid rgba(234,249,255,.20);border-radius:999px;background:rgba(0,12,20,.22);color:rgba(234,249,255,.48);font-size:36px;line-height:1;display:grid;place-items:center;z-index:20;backdrop-filter:blur(6px);cursor:pointer;transition:160ms ease;user-select:none}.nav-arrow:hover,.nav-arrow:focus-visible{color:rgba(234,249,255,.75);border-color:rgba(132,255,210,.26);background:rgba(0,10,14,.34);outline:none}.left{left:24px}.right{right:24px}.plate-mark{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));font:10px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;color:rgba(234,249,255,.54);pointer-events:none;z-index:5;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}.plate-mark b{font-weight:700;color:rgba(234,249,255,.86)}
@media(max-width:720px){.nav-arrow{width:48px;height:48px;font-size:30px}.left{left:14px}.right{right:14px}.plate-mark{display:none}}
</style>
</head>
<body>
<main class="stage">
<svg id="stage" viewBox="0 0 900 1600" role="img" aria-label="Theorem Zero savant plate reader">
  <defs>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.0" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="wideGlow" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="6.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bleedGlow" x="-140%" y="-140%" width="380%" height="380%"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%"><stop offset="0%" stop-color="#000" stop-opacity="0"/><stop offset="78%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".34"/></radialGradient>
  </defs>
  <rect width="900" height="1600" fill="#020b12" data-role="ground" />
  <g id="fieldLayer"></g>
  <g id="constructionLayer"></g>
  <g id="proofLayer"></g>
  <g id="lightLayer"></g>
  <g id="labelLayer"></g>
  <rect width="900" height="1600" fill="url(#vignette)" pointer-events="none" data-role="vignette" />
</svg>
</main>
<button id="prev" class="nav-arrow left" type="button" aria-label="Previous plate">‹</button>
<button id="next" class="nav-arrow right" type="button" aria-label="Next plate">›</button>
<div id="plateMark" class="plate-mark"></div>
<script>
'use strict';
const SQRT3=Math.sqrt(3),TAU=Math.PI*2;
const SCREEN=Object.freeze({w:900,h:1600,ox:450,oy:800,unit:148,rotation:-Math.PI/2});
const COLORS=Object.freeze({ink:'#eaf9ff',dim:'rgba(234,249,255,.62)',pale:'rgba(234,249,255,.38)',blue:'#b7e4ff',cyan:'#c7f5ff',mint:'#9fffe0',green:'#a1ffb6',gold:'#ffe08a',amber:'#ffc36e',rose:'#ff8fa5',red:'#ff6678',violet:'#d0c2ff',deep:'#8ca0ff'});
const PALETTES=[['#ffffff','#c7f5ff','#9fffe0'],['#ffe08a','#ff8fa5','#d0c2ff'],['#a1ffb6','#9fffe0','#ffffff'],['#b7e4ff','#8ca0ff','#d0c2ff'],['#ffffff','#ffffff','#eaf9ff'],['#ff6678','#ffc36e','#ffe08a'],['#9fffe0','#c7f5ff','#ff8fa5']];
function clamp01(v){return Math.max(0,Math.min(1,v))}function smooth(v){v=clamp01(v);return v*v*(3-2*v)}function span(t,a,b){return b===a?(t>=b?1:0):smooth((t-a)/(b-a))}function mix(a,b,t){t=clamp01(t);return a+(b-a)*t}function rng(seed){let x=seed>>>0;return()=>{x=(1664525*x+1013904223)>>>0;return x/4294967296}}
function axial(q,r){return Object.freeze({q,r,x:q+r/2,y:r*SQRT3/2,id:q+','+r})}function key(q,r){return q+','+r}function gdist(p){return Math.max(Math.abs(p.q),Math.abs(p.r),Math.abs(p.q+p.r))}function proj(p){const c=Math.cos(SCREEN.rotation),s=Math.sin(SCREEN.rotation),xr=p.x*c-p.y*s,yr=p.x*s+p.y*c;return{x:SCREEN.ox+SCREEN.unit*xr,y:SCREEN.oy-SCREEN.unit*yr}}function lerpP(a,b,t){return{x:mix(a.x,b.x,t),y:mix(a.y,b.y,t),id:'lerp'}}
function svgEl(name,attrs,parent){const n=document.createElementNS('http://www.w3.org/2000/svg',name);for(const[k,v]of Object.entries(attrs||{}))n.setAttribute(k,String(v));parent.appendChild(n);return n}function ptsAttr(pts){return pts.map(proj).map(p=>p.x.toFixed(3)+','+p.y.toFixed(3)).join(' ')}
class Model{constructor(){this.O=axial(0,0);this.A=axial(-1,0);this.B=axial(-1,1);this.C=axial(0,1);this.D=axial(1,0);this.E=axial(1,-1);this.F=axial(0,-1);this.boundary=[this.A,this.B,this.C,this.D,this.E,this.F];this.points=[];for(let q=-12;q<=12;q++)for(let r=-12;r<=12;r++)this.points.push(axial(q,r));this.points.sort((a,b)=>gdist(a)-gdist(b));this.edges=[];for(let q=-12;q<=12;q++)for(let r=-12;r<=12;r++){const p=axial(q,r);[[1,0],[0,1],[1,-1]].forEach(([dq,dr],f)=>{const n=axial(q+dq,r+dr);if(gdist(p)<=12&&gdist(n)<=12)this.edges.push(Object.freeze({a:p,b:n,f,d:Math.max(gdist(p),gdist(n))}))})}this.edges.sort((x,y)=>x.d-y.d);}
ring(n){return this.points.filter(p=>gdist(p)===n)}within(n){return this.points.filter(p=>gdist(p)<=n)}edgesWithin(n){return this.edges.filter(e=>e.d<=n)}cellsWithin(n){const out=[];for(let q=-n;q<=n;q++)for(let r=-n;r<=n;r++){const p=axial(q,r),a=axial(q+1,r),b=axial(q,r+1),c=axial(q+1,r-1);if(gdist(p)<=n&&gdist(a)<=n&&gdist(b)<=n)out.push([p,a,b]);if(gdist(p)<=n&&gdist(a)<=n&&gdist(c)<=n)out.push([p,c,a]);}return out}}
class Renderer{constructor(){this.layers={field:document.getElementById('fieldLayer'),construction:document.getElementById('constructionLayer'),proof:document.getElementById('proofLayer'),light:document.getElementById('lightLayer'),label:document.getElementById('labelLayer')}}clear(){Object.values(this.layers).forEach(l=>l.textContent='')}line(a,b,t=1,color=COLORS.ink,width=2,opacity=1,layer='construction',dash='none',glow='softGlow'){if(t<=0||opacity<=0)return;const A=proj(a),B=proj(lerpP(a,b,t));svgEl('line',{x1:A.x,y1:A.y,x2:B.x,y2:B.y,stroke:color,'stroke-width':width*1.22,'stroke-opacity':Math.min(1,opacity*1.45*clamp01(t)),'stroke-linecap':'round','stroke-dasharray':dash,filter:`url(#${glow})`},this.layers[layer])}point(p,t=1,color=COLORS.ink,r=4,opacity=1,layer='construction',glow='wideGlow'){if(t<=0||opacity<=0)return;const P=proj(p);svgEl('circle',{cx:P.x,cy:P.y,r:r*(.85+.35*clamp01(t)),fill:color,'fill-opacity':Math.min(1,opacity*1.45*clamp01(t)),filter:`url(#${glow})`},this.layers[layer])}circle(center,radius,t=1,color=COLORS.ink,width=2,opacity=1,layer='construction',dash=null,fill='none',fillOpacity=0){if(t<=0||opacity<=0)return;const P=proj(center),R=SCREEN.unit*radius,circ=TAU*R;svgEl('circle',{cx:P.x,cy:P.y,r:R,fill,'fill-opacity':Math.min(1,fillOpacity*1.55*clamp01(t)),stroke:color,'stroke-width':width*1.22,'stroke-opacity':Math.min(1,opacity*1.45*clamp01(t)),'stroke-dasharray':dash||`${circ} ${circ}`,'stroke-dashoffset':dash?'0':String(circ*(1-clamp01(t))),transform:`rotate(-90 ${P.x} ${P.y})`,filter:'url(#softGlow)'},this.layers[layer])}poly(pts,t=1,fill=COLORS.mint,opacity=.14,stroke=COLORS.ink,strokeOpacity=.32,width=1,layer='proof'){if(t<=0)return;svgEl('polygon',{points:ptsAttr(pts),fill,'fill-opacity':Math.min(1,opacity*1.45*clamp01(t)),stroke,'stroke-opacity':Math.min(1,strokeOpacity*1.5*clamp01(t)),'stroke-width':width*1.22,'stroke-linejoin':'round',filter:'url(#softGlow)'},this.layers[layer])}path(d,t=1,color=COLORS.ink,width=2,opacity=1,layer='construction',fill='none',fillOpacity=0){if(t<=0)return;svgEl('path',{d,fill,'fill-opacity':Math.min(1,fillOpacity*1.55*clamp01(t)),stroke:color,'stroke-width':width*1.22,'stroke-opacity':Math.min(1,opacity*1.45*clamp01(t)),'stroke-linecap':'round','stroke-linejoin':'round',filter:'url(#softGlow)'},this.layers[layer])}textScreen(x,y,str,t=1,color=COLORS.pale,size=11){if(t<=0)return;const n=svgEl('text',{x,y,fill:color,'fill-opacity':.75*clamp01(t),'font-size':size,'font-family':'ui-monospace,Menlo,Consolas,monospace','text-anchor':'middle','letter-spacing':'.11em'},this.layers.label);n.textContent=str}}
const M=new Model(),R=new Renderer();
function cycleProgress(raw){if(raw<.485)return raw/.485;if(raw<.515)return 1;return 1-(raw-.515)/.485}function local(t,i,n,pad=.06,spread=.88){const w=spread/n;return span(t,pad+i*w,pad+(i+1)*w)}function palette(i){return PALETTES[i%PALETTES.length]}
function drawLattice(r,m,t,ring,cols,rule=0,alpha=.2){const edges=m.edgesWithin(ring);edges.forEach((e,i)=>{if(rule&&((i+e.f)%rule))return;const q=span(t,e.d/(ring+1),e.d/(ring+1)+.16);if(q>0)R.line(e.a,e.b,1,cols[(e.f+i)%cols.length],.9+1.35*q,Math.min(1,alpha*1.8*q),'field')})}
function drawCells(r,m,t,ring,cols,skip=1,alpha=.12){const cells=m.cellsWithin(ring);cells.forEach((c,i)=>{if(i%skip)return;const d=Math.max(...c.map(gdist));const q=span(t,d/(ring+1),d/(ring+1)+.18);if(q>0)R.poly(c,q,cols[i%cols.length],Math.min(1,alpha*1.8*q),'none',0,0,'proof')})}
function chord(a,b,t,col,w=.9,op=.45){R.line(a,b,t,col,w,op,'construction')}
function bezierThrough(points){const ps=points.map(proj);let d=`M ${ps[0].x} ${ps[0].y}`;for(let i=1;i<ps.length;i++){const p=ps[i],prev=ps[i-1];const cx=(prev.x+p.x)/2,cy=(prev.y+p.y)/2;d+=` Q ${cx} ${cy} ${p.x} ${p.y}`}return d}
const FAMILIES=['monastic radius','circle parliament','chord harp','hex engine','field rain','triangular cathedral','lattice nerve','blackwork proof','chromatic bloom','diameter choir','mechanical shutter','interference net','cell furnace','quiet stations','orbit mask','broken compass','parallel weather','rose wheel','mesh avalanche','white theorem'];
function renderFamily(index,t,r,m){const fam=index%20,rep=Math.floor(index/20),seed=13001+index*811;const rnd=rng(seed);const cols=palette(index+rep);const ring=3+(index%5)+Math.floor(rep/2);const mono=(fam===7||fam===19);const c1=mono?COLORS.ink:cols[0],c2=mono?COLORS.pale:cols[1],c3=mono?COLORS.dim:cols[2];
if(fam===0){m.boundary.forEach((p,i)=>{r.line(m.O,p,local(t,i,6,.08,.62),c1,1.8,.75)});r.circle(m.O,1,span(t,.48,.76),c2,1.2,.55,'proof','7 10');r.point(m.O,span(t,.12,.22),COLORS.rose,4,.75);}
else if(fam===1){m.within(ring).forEach((p,i)=>{if((p.q-p.r+rep)%2)return;const q=span(t,gdist(p)/(ring+1),gdist(p)/(ring+1)+.21);r.circle(p,1,q,(i+rep)%3?c1:c2,.42+.4*q,.12+.28*q,'construction',i%3?'5 9':null)});}
else if(fam===2){const pts=m.ring(2+rep%4).concat(m.boundary);for(let i=0;i<pts.length;i++){const j=(i*3+5+rep)%pts.length;chord(pts[i],pts[j],local(t,i,pts.length,.04,.88),i%2?c1:c2,.55+(i%5)*.28,.32)}}
else if(fam===3){drawLattice(r,m,t,ring,cols,0,.19);m.boundary.forEach((p,i)=>r.poly([m.O,p,m.boundary[(i+1)%6]],local(t,i,6,.22,.52),i%2?c1:c2,.18,c3,.16,1,'proof'));r.circle(m.O,1,span(t,.68,.88),c1,3,.65,'light');}
else if(fam===4){m.within(ring+2).forEach((p,i)=>{const q=span(t,(i%41)/41,(i%41)/41+.12);if(q>0)r.point(p,q,i%4?c1:c2,1.6+(i%7)*.25,.18+.35*q,'field')});drawLattice(r,m,span(t,.28,.94),ring,cols,3,.13)}
else if(fam===5){drawCells(r,m,t,ring,cols,2+rep%3,.18);r.circle(m.O,1+rep*.22,span(t,.45,.8),c3,1.5,.34,'light','12 16');m.boundary.forEach((p,i)=>r.point(p,local(t,i,6,.10,.44),c1,3.2,.75,'proof'))}
else if(fam===6){let p=m.O;for(let i=0;i<46;i++){const step=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]][Math.floor(rnd()*6)];const n=axial(p.q+step[0],p.r+step[1]);if(gdist(n)<=ring+1){r.line(p,n,local(t,i,46,.03,.88),i%3?c1:c2,.75+(i%4)*.22,.35,'construction');p=n}}r.point(p,span(t,.83,.96),c2,5,.9,'proof')}
else if(fam===7){drawLattice(r,m,t,ring, [COLORS.ink,COLORS.pale,COLORS.dim], 4-rep%2,.25);m.ring(ring-1).forEach((p,i)=>r.point(p,local(t,i,m.ring(ring-1).length,.28,.42),COLORS.ink,1.5,.45,'proof'))}
else if(fam===8){for(let k=0;k<ring+3;k++){const rad=.35+k*.28;const q=local(t,k,ring+3,.04,.82);r.circle(m.O,rad,q,cols[k%3],.8+k*.11,.22+.26*q,'light',k%2?'4 10':null)}m.boundary.forEach((p,i)=>r.circle(p,.24+.08*rep,local(t,i,6,.18,.52),cols[(i+1)%3],1.4,.38,'proof'))}
else if(fam===9){[[m.A,m.D],[m.B,m.E],[m.C,m.F]].forEach((pair,i)=>r.line(pair[0],pair[1],local(t,i,3,.08,.42),i?c1:c2,2.1,.75,'construction'));m.boundary.forEach((p,i)=>r.line(p,m.boundary[(i+2)%6],local(t,i,6,.36,.50),c3,1.2,.38,'proof'));r.circle(m.O,1,span(t,.64,.84),c1,1.5,.5,'light')}
else if(fam===10){m.boundary.forEach((p,i)=>{const q=local(t,i,6,.08,.70);r.poly([m.O,p,m.boundary[(i+1)%6]],q,cols[(i+rep)%3],.08+.16*q,cols[(i+1)%3],.20,1.2,'proof')});r.circle(m.O,.18+rep*.08,span(t,.78,.92),c2,5,.78,'light')}
else if(fam===11){const pts=m.within(ring+1);for(let i=0;i<80;i++){const a=pts[Math.floor(rnd()*pts.length)],b=pts[Math.floor(rnd()*pts.length)];if(Math.hypot(a.x-b.x,a.y-b.y)<4.1)r.line(a,b,local(t,i,80,.02,.90),i%5?c1:c2,.42+(i%6)*.18,.20,'construction')}}
else if(fam===12){drawCells(r,m,t,ring+1,cols,1,.08);m.ring(ring).forEach((p,i)=>r.circle(p,.48,local(t,i,m.ring(ring).length,.24,.60),i%2?c1:c2,1.1,.22,'light','3 12'));}
else if(fam===13){m.boundary.forEach((p,i)=>r.point(p,local(t,i,6,.10,.52),c1,5,.8,'proof'));r.point(m.O,span(t,.45,.62),COLORS.rose,7,.9,'proof');r.circle(m.O,1,span(t,.62,.84),COLORS.pale,1.3,.28,'construction','2 14')}
else if(fam===14){for(let k=0;k<12;k++){const a=k*TAU/12+rep*.07,b=a+TAU*(.08+.02*(k%4));const C=proj(m.O),Rr=SCREEN.unit*(.55+.12*k);const p1={x:C.x+Rr*Math.cos(a),y:C.y+Rr*Math.sin(a)},p2={x:C.x+Rr*Math.cos(b),y:C.y+Rr*Math.sin(b)};const large=0;const d=`M ${p1.x} ${p1.y} A ${Rr} ${Rr} 0 ${large} 1 ${p2.x} ${p2.y}`;r.path(d,local(t,k,12,.05,.82),cols[k%3],1.4+(k%3)*.4,.42,'light')}}
else if(fam===15){drawLattice(r,m,t,ring,cols,2,.13);for(let i=0;i<18;i++){const p=m.within(ring)[Math.floor(rnd()*m.within(ring).length)];r.circle(p,.25+rnd()*.9,local(t,i,18,.10,.72),i%2?COLORS.ink:c2,.7+rnd()*1.2,.15+rnd()*.2,'construction',i%2?'2 8':null)}}
else if(fam===16){m.edgesWithin(ring+1).forEach((e,i)=>{if(e.f!==rep%3)return;const q=span(t,e.d/(ring+1),e.d/(ring+1)+.25);r.line(e.a,e.b,q,c1,1.2,.32,'field')});m.edgesWithin(ring+1).forEach((e,i)=>{if(e.f===(rep+1)%3)return;const q=span(t,.45+e.d/(ring+1)*.25,.85);r.line(e.a,e.b,q,c2,.45,.10,'proof')})}
else if(fam===17){m.boundary.forEach((p,i)=>{const q=local(t,i,6,.05,.44);r.line(m.O,p,q,c1,1.2,.45);r.circle(p,1,q,c2,1.2,.24,'construction')});m.ring(2+rep%3).forEach((p,i)=>r.line(m.O,p,local(t,i,m.ring(2+rep%3).length,.45,.42),i%2?c3:c1,.55,.22,'proof'))}
else if(fam===18){drawLattice(r,m,t,ring+2,cols,0,.08);const pts=m.within(ring+1);for(let i=0;i<65;i++){const p=pts[i%pts.length],q=pts[(i*7+rep*11)%pts.length];r.line(p,q,local(t,i,65,.02,.90),cols[(i+rep)%3],.35+(i%4)*.13,.13,'construction')}}
else if(fam===19){drawCells(r,m,t,ring,[COLORS.ink,COLORS.ink,COLORS.ink],3,.10);m.edgesWithin(ring).forEach((e,i)=>{if(i%5===0)r.line(e.a,e.b,local(t,i%37,37,.12,.72),COLORS.ink,1.1,.38,'construction')});r.circle(m.O,1,span(t,.78,.94),COLORS.ink,1.2,.44,'light')}
}
const PLATE_COUNT=100;const plates=Array.from({length:PLATE_COUNT},(_,i)=>Object.freeze({index:i,id:'savant-'+String(i+1).padStart(3,'0'),title:'Savant Plate '+String(i+1).padStart(3,'0'),family:FAMILIES[i%20],render(t){renderFamily(i,t,R,M)}}));
let plateIndex=0,cycleStart=performance.now();const mark=document.getElementById('plateMark');function setPlate(i){plateIndex=(i+plates.length)%plates.length;cycleStart=performance.now();const p=plates[plateIndex];mark.innerHTML='<b>'+String(plateIndex+1).padStart(3,'0')+'/100</b> '+p.family;}document.getElementById('prev').addEventListener('click',()=>setPlate(plateIndex-1));document.getElementById('next').addEventListener('click',()=>setPlate(plateIndex+1));window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')setPlate(plateIndex-1);if(e.key==='ArrowRight')setPlate(plateIndex+1)});
function frame(now){R.clear();const elapsed=(now-cycleStart)%16000;const raw=elapsed/16000;const p=cycleProgress(raw);plates[plateIndex].render(p);requestAnimationFrame(frame)}setPlate(0);requestAnimationFrame(frame);
</script>
</body>
</html>
